<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Visual meditation</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="scene"></canvas>

  <main id="home" class="panel">
    <div id="modes" class="modes" hidden></div>
    <p id="blurb" class="blurb"></p>
    <div id="settings"></div>
    <button id="start" class="primary">Begin</button>
    <p id="summary" class="summary"></p>
  </main>

  <div id="hud" class="hud" hidden>
    <p id="phase"></p>
    <p id="remaining" class="remaining"></p>
    <button id="end">End session</button>
  </div>

  <p id="error" class="error" hidden></p>
</body>
</html>
